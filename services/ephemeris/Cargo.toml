[package]
name = "astradia-ephemeris"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false
license = "AGPL-3.0-only"

[dependencies]
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
secrecy = "0.10"
sha2 = "0.10"
subtle = "2"
sweph = "=0.3.0"
tokio = { version = "1", features = ["full"] }

[build-dependencies]
tar = "0.4"
flate2 = "1"

[lints.rust]
unsafe_code = "forbid"
[lints.clippy]
await_holding_lock = "deny"
# No unwrap or expect outside tests (clippy.toml allows them in tests).
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
# Integer overflow panics in release as it does in debug, instead of wrapping.
overflow-checks = true
