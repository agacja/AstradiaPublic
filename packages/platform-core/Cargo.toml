[package]
name = "astradia-platform-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[dependencies]
aes-gcm = "0.10"
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
ethers-core = "2"
hex = "0.4"
hmac = "0.12"
# Action signatures (k256) and the signing provider's request signatures
# (p256) on crypto-bigint 0.7; ethers-core keeps the types, hashing and
# public signature recovery.
k256 = { version = "0.14", features = ["ecdsa"] }
p256 = { version = "0.14", features = ["ecdsa", "pkcs8"] }
redis = { version = "0.29", features = ["tokio-comp", "connection-manager"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rmp-serde = "1"
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_json_canonicalizer = "0.3"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
# A stand-in wallet provider, a silent Redis server and a Redis stand-in in the
# tests.
axum = "0.8"
tokio = { version = "1", features = ["net", "io-util", "test-util"] }
# Stops the Redis stand-in's listener and connections when a test takes the
# server away.
tokio-util = "0.7"
# The signers the code used before, as references in src/signing.rs's tests.
ethers-signers = "2"
p256_013 = { package = "p256", version = "0.13", features = ["ecdsa", "pkcs8"] }

[lints.rust]
unsafe_code = "forbid"
# Identifiers are ASCII, which rules out look-alike letters from other scripts.
non_ascii_idents = "forbid"
rust_2018_idioms = { level = "deny", priority = -1 }
trivial_casts = "deny"
trivial_numeric_casts = "deny"
[lints.clippy]
await_holding_lock = "deny"
# No unwrap or expect outside tests (clippy.toml allows them in tests). A true
# invariant takes #[expect(clippy::expect_used, reason = "...")].
unwrap_used = "deny"
expect_used = "deny"
unwrap_in_result = "deny"
get_unwrap = "deny"
# None of the macros and calls that end the process or leave work unwritten
# (clippy.toml lets a test panic).
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
exit = "deny"
mem_forget = "deny"
# Output goes through tracing, where what may be logged is decided once.
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
# No future is discarded with `let _`, which would drop it unpolled, and none
# is over clippy's size limit for a future.
let_underscore_future = "deny"
large_futures = "deny"
# Numbers: a widening conversion says so with From, and floats are neither
# compared for equality nor written with digits they cannot hold.
cast_lossless = "deny"
float_cmp = "deny"
lossy_float_literal = "deny"
# No wildcard arm in a match on an enum, so a new variant is a compile error
# (the lint exempts Option and Result).
wildcard_enum_match_arm = "deny"

[profile.release]
# Integer overflow panics in release as it does in debug, instead of wrapping.
overflow-checks = true
