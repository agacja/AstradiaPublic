name: Public workspace checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  boundary:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 scripts/check-public-boundary.py
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Scan public history for secrets
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gitleaks"
          cd "$RUNNER_TEMP/gitleaks"
          curl --fail --silent --show-error --location --remote-name https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl --fail --silent --show-error --location --remote-name https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          sha256sum --check --ignore-missing gitleaks_8.30.1_checksums.txt
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz
          ./gitleaks git --redact "$GITHUB_WORKSPACE"
  frontend:
    needs: boundary
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
  social:
    needs: boundary
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: postgres
        ports: ['55443:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/social-store/go.mod
          cache-dependency-path: packages/social-store/go.sum
      - run: go test -race ./...
        working-directory: packages/social-store
        env:
          PLATFORM_TEST_DATABASE_URL: postgres://postgres:local-test-only@127.0.0.1:55443/postgres
  astronomy:
    needs: boundary
    runs-on: ubuntu-24.04
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.94.1 --profile minimal --component clippy,rustfmt && rustup default 1.94.1
      - run: cargo fmt --manifest-path services/ephemeris/Cargo.toml --check
      - run: cargo build --locked --manifest-path services/ephemeris/Cargo.toml
      - run: cargo clippy --locked --manifest-path services/ephemeris/Cargo.toml --all-targets -- -D warnings
      - run: python3 scripts/smoke-ephemeris.py
